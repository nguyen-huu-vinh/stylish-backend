<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stylish Admin Portal</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg-body: #f3f4f6;
        --bg-card: #ffffff;
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border-color: #e5e7eb;
        --danger: #ef4444;
        --danger-hover: #dc2626;
        --warning: #f59e0b;
        --success: #10b981;
        --sidebar-width: 260px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }

      body {
        background-color: var(--bg-body);
        color: var(--text-main);
        min-height: 100vh;
      }

      .hidden {
        display: none !important;
      }

      /* ================= LOGIN SCREEN ================= */
      .login-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
      }

      .login-card {
        background: var(--bg-card);
        padding: 40px;
        border-radius: 16px;
        box-shadow:
          0 20px 25px -5px rgba(0, 0, 0, 0.1),
          0 10px 10px -5px rgba(0, 0, 0, 0.04);
        width: 100%;
        max-width: 420px;
        text-align: center;
      }

      .login-card .logo {
        font-size: 28px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }

      .login-card p {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 28px;
      }

      .form-group {
        margin-bottom: 20px;
        text-align: left;
      }

      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        color: var(--text-main);
        margin-bottom: 6px;
      }

      .input-icon {
        position: relative;
      }

      .input-icon i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
      }

      .form-control {
        width: 100%;
        padding: 12px 14px 12px 40px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        transition: all 0.2s;
        outline: none;
      }

      .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      .btn-primary {
        width: 100%;
        padding: 12px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.2s;
      }

      .btn-primary:hover {
        background-color: var(--primary-hover);
      }

      .error-msg {
        color: var(--danger);
        font-size: 13px;
        margin-top: 12px;
      }

      /* ================= DASHBOARD LAYOUT ================= */
      .dashboard-container {
        display: flex;
        min-height: 100vh;
      }

      /* Sidebar */
      .sidebar {
        width: var(--sidebar-width);
        background-color: #1e1b4b;
        color: white;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        position: fixed;
        height: 100vh;
      }

      .sidebar-brand {
        font-size: 20px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px 24px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: #818cf8;
      }

      .sidebar-menu {
        list-style: none;
        margin-top: 24px;
        flex-grow: 1;
      }

      .sidebar-menu li {
        margin-bottom: 8px;
      }

      .sidebar-menu a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        color: #c7d2fe;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
        transition: all 0.2s;
      }

      .sidebar-menu a:hover,
      .sidebar-menu a.active {
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
      }

      .sidebar-menu a.active {
        background-color: var(--primary);
      }

      .btn-logout {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fca5a5;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 500;
        transition: all 0.2s;
      }

      .btn-logout:hover {
        background: rgba(239, 68, 68, 0.2);
        border-color: var(--danger);
        color: white;
      }

      /* Main Content Area */
      .main-content {
        margin-left: var(--sidebar-width);
        flex-grow: 1;
        padding: 32px;
      }

      .page-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 28px;
      }

      .page-title {
        font-size: 24px;
        font-weight: 700;
      }

      /* Cards & Form */
      .card {
        background: var(--bg-card);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        margin-bottom: 28px;
        border: 1px solid var(--border-color);
      }

      .card-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 20px;
        color: var(--text-main);
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .form-control-simple {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        outline: none;
      }

      .form-control-simple:focus {
        border-color: var(--primary);
      }

      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 10px;
      }

      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      /* Tables */
      .table-responsive {
        overflow-x: auto;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }

      th {
        background-color: #f9fafb;
        padding: 12px 16px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border-color);
      }

      td {
        padding: 16px;
        border-bottom: 1px solid var(--border-color);
        font-size: 14px;
        vertical-align: middle;
      }

      tr:last-child td {
        border-bottom: none;
      }

      .badge {
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        display: inline-block;
      }

      .badge-success {
        background: #d1fae5;
        color: #065f46;
      }
      .badge-warning {
        background: #fef3c7;
        color: #92400e;
      }
      .badge-secondary {
        background: #e5e7eb;
        color: #374151;
      }

      .btn-action {
        padding: 6px 12px;
        border-radius: 6px;
        border: none;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        transition: all 0.2s;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .btn-delete {
        background: #fee2e2;
        color: #991b1b;
      }
      .btn-delete:hover {
        background: #fca5a5;
      }

      .btn-toggle {
        background: #fef3c7;
        color: #92400e;
      }
      .btn-toggle:hover {
        background: #fde68a;
      }

      .product-img {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!-- 1. MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-section" class="login-wrapper">
      <div class="login-card">
        <div class="logo"><i class="fa-solid fa-store"></i> STYLISH ADMIN</div>
        <p>Vui lòng đăng nhập để quản lý cửa hàng</p>

        <div class="form-group">
          <label>Email Admin</label>
          <div class="input-icon">
            <i class="fa-regular fa-envelope"></i>
            <input
              type="email"
              id="email"
              class="form-control"
              value="admin@gmail.com"
              placeholder="admin@gmail.com"
            />
          </div>
        </div>

        <div class="form-group">
          <label>Mật khẩu</label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="password"
              class="form-control"
              value="Admin123456"
              placeholder="••••••••"
            />
          </div>
        </div>

        <button onclick="login()" class="btn-primary">
          Đăng Nhập
          <i class="fa-solid fa-arrow-right" style="margin-left: 6px"></i>
        </button>
        <div id="login-error" class="error-msg"></div>
      </div>
    </div>

    <!-- 2. GIAO DIỆN QUẢN TRỊ DASHBOARD -->
    <div id="admin-section" class="dashboard-container hidden">
      <!-- Sidebar Navigation -->
      <div class="sidebar">
        <div class="sidebar-brand">
          <i class="fa-solid fa-bag-shopping"></i> Stylish Portal
        </div>

        <ul class="sidebar-menu">
          <li>
            <a
              href="#"
              id="menu-products"
              class="active"
              onclick="switchTab('products')"
            >
              <i class="fa-solid fa-box"></i> Quản Lý Sản Phẩm
            </a>
          </li>
          <li>
            <a href="#" id="menu-users" onclick="switchTab('users')">
              <i class="fa-solid fa-users"></i> Quản Lý Tài Khoản
            </a>
          </li>
        </ul>

        <button class="btn-logout" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất
        </button>
      </div>

      <!-- Main Content Area -->
      <div class="main-content">
        <!-- TAB 1: SẢN PHẨM -->
        <div id="tab-products">
          <div class="page-header">
            <h1 class="page-title">Danh Sách Sản Phẩm</h1>
          </div>

          <!-- Form Thêm Sản Phẩm -->
          <div class="card">
            <div class="card-title">
              <i
                class="fa-solid fa-plus-circle"
                style="color: var(--primary)"
              ></i>
              Thêm Sản Phẩm Mới
            </div>
            <div class="form-grid">
              <div class="form-group">
                <label>Tên sản phẩm</label>
                <input
                  type="text"
                  id="name"
                  class="form-control-simple"
                  placeholder="Áo sơ mi nam..."
                />
              </div>
              <div class="form-group">
                <label>Giá gốc (VNĐ)</label>
                <input
                  type="number"
                  id="price"
                  class="form-control-simple"
                  placeholder="250000"
                />
              </div>
              <div class="form-group">
                <label>Giá giảm (Khuyến mãi)</label>
                <input
                  type="number"
                  id="discount_price"
                  class="form-control-simple"
                  placeholder="199000 (nếu có)"
                />
              </div>
              <div class="form-group">
                <label>Link Ảnh (URL)</label>
                <input
                  type="text"
                  id="image_url"
                  class="form-control-simple"
                  placeholder="https://..."
                />
              </div>
            </div>

            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="is_sale" /> Đang giảm giá (Sale)
              </label>
              <label class="checkbox-label">
                <input type="checkbox" id="is_trending" /> Nổi bật (Trending)
              </label>
            </div>

            <br />
            <button
              onclick="createProduct()"
              class="btn-primary"
              style="width: auto; padding: 10px 24px"
            >
              <i class="fa-solid fa-check"></i> Lưu Sản Phẩm
            </button>
          </div>

          <!-- Bảng Sản Phẩm -->
          <div class="card">
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>Ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá niêm yết</th>
                    <th>Giá Sale</th>
                    <th>Trạng thái</th>
                    <th>Thao tác</th>
                  </tr>
                </thead>
                <tbody id="product-list"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- TAB 2: NGƯỜI DÙNG -->
        <div id="tab-users" class="hidden">
          <div class="page-header">
            <h1 class="page-title">Quản Lý Tài Khoản</h1>
          </div>

          <div class="card">
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Họ và Tên</th>
                    <th>Email</th>
                    <th>Vai Trò</th>
                    <th>Hành Động</th>
                  </tr>
                </thead>
                <tbody id="user-list"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- JAVASCRIPT XỬ LÝ API -->
    <script>
      let token = localStorage.getItem("admin_token");

      if (token) {
        showAdminSection();
      }

      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorDiv = document.getElementById("login-error");
        errorDiv.innerText = "";

        const formData = new URLSearchParams();
        formData.append("username", email);
        formData.append("password", password);

        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData,
          });

          if (response.ok) {
            const data = await response.json();
            token = data.access_token;
            localStorage.setItem("admin_token", token);
            showAdminSection();
          } else {
            const errData = await response.json();
            errorDiv.innerText =
              errData.detail || "Email hoặc mật khẩu không đúng!";
          }
        } catch (err) {
          errorDiv.innerText = "Lỗi kết nối tới Server!";
        }
      }

      function logout() {
        localStorage.removeItem("admin_token");
        location.reload();
      }

      function showAdminSection() {
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("admin-section").classList.remove("hidden");
        loadProducts();
      }

      function switchTab(tabName) {
        const tabProd = document.getElementById("tab-products");
        const tabUser = document.getElementById("tab-users");
        const menuProd = document.getElementById("menu-products");
        const menuUser = document.getElementById("menu-users");

        if (tabName === "products") {
          tabProd.classList.remove("hidden");
          tabUser.classList.add("hidden");
          menuProd.classList.add("active");
          menuUser.classList.remove("active");
          loadProducts();
        } else {
          tabProd.classList.add("hidden");
          tabUser.classList.remove("hidden");
          menuProd.classList.remove("active");
          menuUser.classList.add("active");
          loadUsers();
        }
      }

      // ---------- SẢN PHẨM ----------
      async function loadProducts() {
        const res = await fetch("/products");
        const products = await res.json();
        const tbody = document.getElementById("product-list");
        tbody.innerHTML = "";

        products.forEach((p) => {
          let badges = "";
          if (p.is_sale)
            badges += '<span class="badge badge-warning">Sale</span> ';
          if (p.is_trending)
            badges += '<span class="badge badge-success">Trending</span>';
          if (!badges)
            badges = '<span class="badge badge-secondary">Thường</span>';

          tbody.innerHTML += `
                    <tr>
                        <td><img src="${p.image_url}" class="product-img" onerror="this.src='https://via.placeholder.com/44'"></td>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.price.toLocaleString()}đ</td>
                        <td>${p.discount_price ? '<strong style="color:var(--danger);">' + p.discount_price.toLocaleString() + "đ</strong>" : "-"}</td>
                        <td>${badges}</td>
                        <td>
                            <button class="btn-action btn-delete" onclick="deleteProduct(${p.id})">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </button>
                        </td>
                    </tr>
                `;
        });
      }

      async function createProduct() {
        const data = {
          name: document.getElementById("name").value,
          price: parseFloat(document.getElementById("price").value),
          discount_price: document.getElementById("discount_price").value
            ? parseFloat(document.getElementById("discount_price").value)
            : null,
          image_url: document.getElementById("image_url").value,
          is_sale: document.getElementById("is_sale").checked,
          is_trending: document.getElementById("is_trending").checked,
        };

        const res = await fetch("/products", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          alert("Đã thêm sản phẩm mới thành công!");
          loadProducts();
        } else {
          alert("Lỗi khi thêm sản phẩm!");
        }
      }

      async function deleteProduct(id) {
        if (!confirm("Bạn có chắc chắn muốn xóa sản phẩm này không?")) return;

        const res = await fetch(`/products/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });

        if (res.ok) {
          loadProducts();
        } else {
          alert("Xóa sản phẩm thất bại!");
        }
      }

      // ---------- NGƯỜI DÙNG ----------
      async function loadUsers() {
        const res = await fetch("/users", {
          headers: { Authorization: `Bearer ${token}` },
        });

        if (!res.ok) return;

        const users = await res.json();
        const tbody = document.getElementById("user-list");
        tbody.innerHTML = "";

        users.forEach((u) => {
          const roleBadge = u.is_admin
            ? '<span class="badge badge-success"><i class="fa-solid fa-shield"></i> Admin</span>'
            : '<span class="badge badge-secondary">Khách hàng</span>';

          const toggleRoleText = u.is_admin ? "Hủy Admin" : "Cấp Admin";

          tbody.innerHTML += `
                    <tr>
                        <td>#${u.id}</td>
                        <td><strong>${u.full_name}</strong></td>
                        <td>${u.email}</td>
                        <td>${roleBadge}</td>
                        <td>
                            <button class="btn-action btn-toggle" onclick="toggleUserRole(${u.id}, ${!u.is_admin})">
                                <i class="fa-solid fa-user-gear"></i> ${toggleRoleText}
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteUser(${u.id})">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </button>
                        </td>
                    </tr>
                `;
        });
      }

      async function toggleUserRole(userId, newIsAdmin) {
        const res = await fetch(`/users/${userId}/role`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify({ is_admin: newIsAdmin }),
        });

        if (res.ok) {
          loadUsers();
        } else {
          alert("Thay đổi quyền thất bại!");
        }
      }

      async function deleteUser(userId) {
        if (!confirm("Bạn có chắc muốn xóa tài khoản này?")) return;

        const res = await fetch(`/users/${userId}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });

        if (res.ok) {
          loadUsers();
        } else {
          const err = await res.json();
          alert(err.detail || "Không thể xóa tài khoản này!");
        }
      }
    </script>
  </body>
</html>
