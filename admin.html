<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Quản Lý Sản Phẩm - Admin</title>
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 30px;
        background-color: #f4f4f9;
      }
      .container {
        max-width: 800px;
        margin: 0 auto;
        background: white;
        padding: 20px;
        border-radius: 8px;
        box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
      }
      h2 {
        color: #333;
      }
      .form-group {
        margin-bottom: 15px;
      }
      label {
        display: block;
        margin-bottom: 5px;
        font-weight: bold;
      }
      input[type="text"],
      input[type="number"],
      input[type="email"],
      input[type="password"] {
        width: 100%;
        padding: 8px;
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        background-color: #28a745;
        color: white;
        padding: 10px 15px;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background-color: #218838;
      }
      .hidden {
        display: none;
      }
      .error {
        color: red;
        margin-top: 10px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 20px;
      }
      th,
      td {
        border: 1px solid #ddd;
        padding: 8px;
        text-align: left;
      }
      th {
        background-color: #007bff;
        color: white;
      }
      .delete-btn {
        background-color: #dc3545;
      }
      .delete-btn:hover {
        background-color: #c82333;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <!-- Form Đăng Nhập -->
      <div id="login-section">
        <h2>Đăng Nhập Admin</h2>
        <div class="form-group">
          <label>Email:</label>
          <input type="email" id="email" value="admin@gmail.com" />
        </div>
        <div class="form-group">
          <label>Mật khẩu:</label>
          <input type="password" id="password" value="Admin123456" />
        </div>
        <button onclick="login()">Đăng Nhập</button>
        <div id="login-error" class="error"></div>
      </div>

      <!-- Trang Quản Lý Sản Phẩm (Hiển thị sau khi đăng nhập) -->
      <div id="admin-section" class="hidden">
        <h2>Quản Lý Sản Phẩm</h2>
        <button
          onclick="logout()"
          style="background-color: #6c757d; float: right"
        >
          Đăng Xuất
        </button>
        <br /><br />

        <h3>Thêm Sản Phẩm Mới</h3>
        <div class="form-group">
          <label>Tên sản phẩm:</label>
          <input type="text" id="name" />
        </div>
        <div class="form-group">
          <label>Giá gốc (VNĐ):</label>
          <input type="number" id="price" />
        </div>
        <div class="form-group">
          <label>Giá giảm (VNĐ - tùy chọn):</label>
          <input type="number" id="discount_price" />
        </div>
        <div class="form-group">
          <label>Link hình ảnh (URL):</label>
          <input type="text" id="image_url" />
        </div>
        <div class="form-group">
          <label
            ><input type="checkbox" id="is_sale" /> Đang giảm giá (Sale)</label
          >
          &nbsp;&nbsp;
          <label
            ><input type="checkbox" id="is_trending" /> Nổi bật
            (Trending)</label
          >
        </div>
        <button onclick="createProduct()">Thêm Sản Phẩm</button>

        <h3 style="margin-top: 30px">Danh Sách Sản Phẩm</h3>
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Tên</th>
              <th>Giá gốc</th>
              <th>Giá giảm</th>
              <th>Hành động</th>
            </tr>
          </thead>
          <tbody id="product-list"></tbody>
        </table>
      </div>
    </div>

    <script>
      let token = localStorage.getItem("admin_token");

      if (token) {
        showAdminSection();
      }

      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorDiv = document.getElementById("login-error");
        errorDiv.innerText = "";

        const formData = new URLSearchParams();
        formData.append("username", email);
        formData.append("password", password);

        try {
          const response = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData,
          });

          if (response.ok) {
            const data = await response.json();
            token = data.access_token;
            localStorage.setItem("admin_token", token);
            showAdminSection();
          } else {
            const errData = await response.json();
            errorDiv.innerText = errData.detail || "Đăng nhập thất bại!";
          }
        } catch (err) {
          errorDiv.innerText = "Lỗi kết nối Server!";
        }
      }

      function logout() {
        localStorage.removeItem("admin_token");
        location.reload();
      }

      function showAdminSection() {
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("admin-section").classList.remove("hidden");
        loadProducts();
      }

      async function loadProducts() {
        const res = await fetch("/products");
        const products = await res.json();
        const tbody = document.getElementById("product-list");
        tbody.innerHTML = "";

        products.forEach((p) => {
          tbody.innerHTML += `
                <tr>
                    <td>${p.id}</td>
                    <td>${p.name}</td>
                    <td>${p.price.toLocaleString()}đ</td>
                    <td>${p.discount_price ? p.discount_price.toLocaleString() + "đ" : "-"}</td>
                    <td>
                        <button class="delete-btn" onclick="deleteProduct(${p.id})">Xóa</button>
                    </td>
                </tr>
            `;
        });
      }

      async function createProduct() {
        const data = {
          name: document.getElementById("name").value,
          price: parseFloat(document.getElementById("price").value),
          discount_price: document.getElementById("discount_price").value
            ? parseFloat(document.getElementById("discount_price").value)
            : null,
          image_url: document.getElementById("image_url").value,
          is_sale: document.getElementById("is_sale").checked,
          is_trending: document.getElementById("is_trending").checked,
        };

        const res = await fetch("/products", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          alert("Thêm sản phẩm thành công!");
          loadProducts();
        } else {
          alert("Thêm thất bại!");
        }
      }

      async function deleteProduct(id) {
        if (!confirm("Bạn có chắc muốn xóa?")) return;

        const res = await fetch(`/products/${id}`, {
          method: "DELETE",
          headers: {
            Authorization: `Bearer ${token}`,
          },
        });

        if (res.ok) {
          loadProducts();
        } else {
          alert("Xóa thất bại!");
        }
      }
    </script>
  </body>
</html>
