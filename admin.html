<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Stylish Admin Portal</title>
    <!-- Google Fonts & Font Awesome Icons -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      :root {
        --primary: #4f46e5;
        --primary-hover: #4338ca;
        --bg-body: #f3f4f6;
        --bg-card: #ffffff;
        --text-main: #1f2937;
        --text-muted: #6b7280;
        --border-color: #e5e7eb;
        --danger: #ef4444;
        --warning: #f59e0b;
        --success: #10b981;
        --sidebar-width: 260px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: "Inter", sans-serif;
      }
      body {
        background-color: var(--bg-body);
        color: var(--text-main);
        min-height: 100vh;
      }
      .hidden {
        display: none !important;
      }

      /* LOGIN SCREEN */
      .login-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 20px;
      }
      .login-card {
        background: var(--bg-card);
        padding: 40px;
        border-radius: 16px;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
        width: 100%;
        max-width: 420px;
        text-align: center;
      }
      .login-card .logo {
        font-size: 26px;
        font-weight: 700;
        color: var(--primary);
        margin-bottom: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
      }
      .login-card p {
        color: var(--text-muted);
        font-size: 14px;
        margin-bottom: 24px;
      }

      .form-group {
        margin-bottom: 16px;
        text-align: left;
      }
      .form-group label {
        display: block;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 6px;
      }
      .input-icon {
        position: relative;
      }
      .input-icon i {
        position: absolute;
        left: 14px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--text-muted);
      }
      .form-control {
        width: 100%;
        padding: 12px 14px 12px 40px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        outline: none;
      }
      .form-control:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.15);
      }

      .btn-primary {
        width: 100%;
        padding: 12px;
        background-color: var(--primary);
        color: white;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
        transition: background 0.2s;
      }
      .btn-primary:hover {
        background-color: var(--primary-hover);
      }
      .error-msg {
        color: var(--danger);
        font-size: 13px;
        margin-top: 12px;
      }

      /* DASHBOARD LAYOUT */
      .dashboard-container {
        display: flex;
        min-height: 100vh;
      }
      .sidebar {
        width: var(--sidebar-width);
        background-color: #1e1b4b;
        color: white;
        padding: 24px 16px;
        display: flex;
        flex-direction: column;
        position: fixed;
        height: 100vh;
      }
      .sidebar-brand {
        font-size: 20px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 12px 24px 12px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: #818cf8;
      }
      .sidebar-menu {
        list-style: none;
        margin-top: 24px;
        flex-grow: 1;
      }
      .sidebar-menu li {
        margin-bottom: 8px;
      }
      .sidebar-menu a {
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 12px 16px;
        color: #c7d2fe;
        text-decoration: none;
        border-radius: 8px;
        font-size: 14px;
        font-weight: 500;
      }
      .sidebar-menu a:hover,
      .sidebar-menu a.active {
        background-color: rgba(255, 255, 255, 0.1);
        color: white;
      }
      .sidebar-menu a.active {
        background-color: var(--primary);
      }

      .btn-logout {
        background: transparent;
        border: 1px solid rgba(255, 255, 255, 0.2);
        color: #fca5a5;
        padding: 10px;
        border-radius: 8px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        font-weight: 500;
      }
      .btn-logout:hover {
        background: rgba(239, 68, 68, 0.2);
        color: white;
      }

      .main-content {
        margin-left: var(--sidebar-width);
        flex-grow: 1;
        padding: 32px;
      }
      .page-header {
        margin-bottom: 24px;
      }
      .page-title {
        font-size: 24px;
        font-weight: 700;
      }

      .card {
        background: var(--bg-card);
        border-radius: 12px;
        padding: 24px;
        box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
        margin-bottom: 28px;
        border: 1px solid var(--border-color);
      }
      .card-title {
        font-size: 16px;
        font-weight: 600;
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 8px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }
      .form-control-simple {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid var(--border-color);
        border-radius: 8px;
        font-size: 14px;
        outline: none;
      }
      .form-control-simple:focus {
        border-color: var(--primary);
      }
      .checkbox-group {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 14px;
      }
      .checkbox-label {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 14px;
        cursor: pointer;
      }

      /* TABLES */
      .table-responsive {
        overflow-x: auto;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        text-align: left;
      }
      th {
        background-color: #f9fafb;
        padding: 12px 16px;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        color: var(--text-muted);
        border-bottom: 1px solid var(--border-color);
      }
      td {
        padding: 16px;
        border-bottom: 1px solid var(--border-color);
        font-size: 14px;
        vertical-align: middle;
      }

      .badge {
        padding: 4px 10px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 600;
        display: inline-block;
      }
      .badge-success {
        background: #d1fae5;
        color: #065f46;
      }
      .badge-warning {
        background: #fef3c7;
        color: #92400e;
      }
      .badge-secondary {
        background: #e5e7eb;
        color: #374151;
      }

      .btn-action {
        padding: 6px 12px;
        border-radius: 6px;
        border: none;
        font-size: 13px;
        font-weight: 500;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }
      .btn-delete {
        background: #fee2e2;
        color: #991b1b;
      }
      .btn-delete:hover {
        background: #fca5a5;
      }
      .btn-toggle {
        background: #e0e7ff;
        color: #3730a3;
      }
      .btn-toggle:hover {
        background: #c7d2fe;
      }
      .product-img {
        width: 44px;
        height: 44px;
        border-radius: 8px;
        object-fit: cover;
      }
    </style>
  </head>
  <body>
    <!-- MÀN HÌNH ĐĂNG NHẬP -->
    <div id="login-section" class="login-wrapper">
      <div class="login-card">
        <div class="logo"><i class="fa-solid fa-store"></i> STYLISH ADMIN</div>
        <p>Vui lòng đăng nhập để quản lý hệ thống</p>

        <div class="form-group">
          <label>Email Admin</label>
          <div class="input-icon">
            <i class="fa-regular fa-envelope"></i>
            <input
              type="email"
              id="email"
              class="form-control"
              value="admin@gmail.com"
              placeholder="admin@gmail.com"
            />
          </div>
        </div>

        <div class="form-group">
          <label>Mật khẩu</label>
          <div class="input-icon">
            <i class="fa-solid fa-lock"></i>
            <input
              type="password"
              id="password"
              class="form-control"
              value="Admin123456"
              placeholder="••••••••"
            />
          </div>
        </div>

        <button onclick="login()" class="btn-primary">
          Đăng Nhập <i class="fa-solid fa-arrow-right"></i>
        </button>
        <div id="login-error" class="error-msg"></div>
      </div>
    </div>

    <!-- MAIN DASHBOARD LAYOUT -->
    <div id="admin-section" class="dashboard-container hidden">
      <div class="sidebar">
        <div class="sidebar-brand">
          <i class="fa-solid fa-bag-shopping"></i> Stylish Admin
        </div>
        <ul class="sidebar-menu">
          <li>
            <a
              href="#"
              id="menu-products"
              class="active"
              onclick="switchTab('products')"
            >
              <i class="fa-solid fa-box"></i> Quản Lý Sản Phẩm
            </a>
          </li>
          <li>
            <a href="#" id="menu-users" onclick="switchTab('users')">
              <i class="fa-solid fa-users"></i> Quản Lý Tài Khoản
            </a>
          </li>
        </ul>
        <button class="btn-logout" onclick="logout()">
          <i class="fa-solid fa-right-from-bracket"></i> Đăng Xuất
        </button>
      </div>

      <div class="main-content">
        <!-- TAB SẢN PHẨM -->
        <div id="tab-products">
          <div class="page-header">
            <h1 class="page-title">Danh Sách Sản Phẩm</h1>
          </div>

          <div class="card">
            <div class="card-title">
              <i
                class="fa-solid fa-plus-circle"
                style="color: var(--primary)"
              ></i>
              Thêm Sản Phẩm Mới
            </div>
            <div class="form-grid">
              <div class="form-group">
                <label>Tên sản phẩm</label>
                <input
                  type="text"
                  id="name"
                  class="form-control-simple"
                  placeholder="Áo sơ mi nam..."
                />
              </div>
              <div class="form-group">
                <label>Giá gốc (VNĐ)</label>
                <input
                  type="number"
                  id="price"
                  class="form-control-simple"
                  placeholder="250000"
                />
              </div>
              <div class="form-group">
                <label>Giá giảm (Khuyến mãi)</label>
                <input
                  type="number"
                  id="discount_price"
                  class="form-control-simple"
                  placeholder="199000"
                />
              </div>
              <div class="form-group">
                <label>URL Hình Ảnh</label>
                <input
                  type="text"
                  id="image_url"
                  class="form-control-simple"
                  placeholder="https://..."
                />
              </div>
            </div>
            <div class="checkbox-group">
              <label class="checkbox-label"
                ><input type="checkbox" id="is_sale" /> Đang Giảm Giá
                (Sale)</label
              >
              <label class="checkbox-label"
                ><input type="checkbox" id="is_trending" /> Sản Phẩm Nổi Bật
                (Trending)</label
              >
            </div>
            <br />
            <button
              onclick="createProduct()"
              class="btn-primary"
              style="width: auto; padding: 10px 24px"
            >
              <i class="fa-solid fa-floppy-disk"></i> Lưu Sản Phẩm
            </button>
          </div>

          <div class="card">
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>Ảnh</th>
                    <th>Tên sản phẩm</th>
                    <th>Giá niêm yết</th>
                    <th>Giá Sale</th>
                    <th>Trạng thái</th>
                    <th>Hành động</th>
                  </tr>
                </thead>
                <tbody id="product-list"></tbody>
              </table>
            </div>
          </div>
        </div>

        <!-- TAB TÀI KHOẢN -->
        <div id="tab-users" class="hidden">
          <div class="page-header">
            <h1 class="page-title">Quản Lý Tài Khoản</h1>
          </div>

          <div class="card">
            <div class="card-title">
              <i
                class="fa-solid fa-user-plus"
                style="color: var(--primary)"
              ></i>
              Thêm / Chỉnh Sửa Tài Khoản
            </div>
            <input type="hidden" id="user-id-edit" />
            <div class="form-grid">
              <div class="form-group">
                <label>Họ và Tên</label>
                <input
                  type="text"
                  id="user-fullname"
                  class="form-control-simple"
                  placeholder="Nguyễn Văn A"
                />
              </div>
              <div class="form-group">
                <label>Email</label>
                <input
                  type="email"
                  id="user-email"
                  class="form-control-simple"
                  placeholder="user@gmail.com"
                />
              </div>
              <div class="form-group" id="password-group">
                <label>Mật khẩu</label>
                <input
                  type="password"
                  id="user-password"
                  class="form-control-simple"
                  placeholder="••••••••"
                />
              </div>
            </div>
            <div class="checkbox-group">
              <label class="checkbox-label">
                <input type="checkbox" id="user-isadmin" /> Phân quyền
                Administrator
              </label>
            </div>
            <br />
            <button
              onclick="saveUser()"
              class="btn-primary"
              style="width: auto; padding: 10px 24px"
            >
              <i class="fa-solid fa-check"></i> Lưu Tài Khoản
            </button>
            <button
              onclick="resetUserForm()"
              class="btn-action btn-toggle"
              style="padding: 10px 16px; margin-left: 10px"
            >
              Làm Mới Form
            </button>
          </div>

          <div class="card">
            <div class="table-responsive">
              <table>
                <thead>
                  <tr>
                    <th>ID</th>
                    <th>Họ và Tên</th>
                    <th>Email</th>
                    <th>Vai Trò</th>
                    <th>Hành Động</th>
                  </tr>
                </thead>
                <tbody id="user-list"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script>
      let token = localStorage.getItem("admin_token");
      if (token) showAdminSection();

      async function login() {
        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const errorDiv = document.getElementById("login-error");
        errorDiv.innerText = "";

        const formData = new URLSearchParams();
        formData.append("username", email);
        formData.append("password", password);

        try {
          const res = await fetch("/login", {
            method: "POST",
            headers: { "Content-Type": "application/x-www-form-urlencoded" },
            body: formData,
          });

          if (res.ok) {
            const data = await res.json();
            token = data.access_token;
            localStorage.setItem("admin_token", token);
            showAdminSection();
          } else {
            const err = await res.json();
            errorDiv.innerText = err.detail || "Đăng nhập thất bại!";
          }
        } catch (e) {
          errorDiv.innerText = "Lỗi kết nối Server!";
        }
      }

      function logout() {
        localStorage.removeItem("admin_token");
        location.reload();
      }

      function showAdminSection() {
        document.getElementById("login-section").classList.add("hidden");
        document.getElementById("admin-section").classList.remove("hidden");
        loadProducts();
      }

      function switchTab(tab) {
        if (tab === "products") {
          document.getElementById("tab-products").classList.remove("hidden");
          document.getElementById("tab-users").classList.add("hidden");
          document.getElementById("menu-products").classList.add("active");
          document.getElementById("menu-users").classList.remove("active");
          loadProducts();
        } else {
          document.getElementById("tab-products").classList.add("hidden");
          document.getElementById("tab-users").classList.remove("hidden");
          document.getElementById("menu-products").classList.remove("active");
          document.getElementById("menu-users").classList.add("active");
          loadUsers();
        }
      }

      // --- HÀM QUẢN LÝ SẢN PHẨM ---
      async function loadProducts() {
        const res = await fetch("/products");
        const products = await res.json();
        const tbody = document.getElementById("product-list");
        tbody.innerHTML = "";

        products.forEach((p) => {
          let badges = "";
          if (p.is_sale)
            badges += '<span class="badge badge-warning">Sale</span> ';
          if (p.is_trending)
            badges += '<span class="badge badge-success">Trending</span>';
          if (!badges)
            badges = '<span class="badge badge-secondary">Thường</span>';

          tbody.innerHTML += `
                    <tr>
                        <td><img src="${p.image_url}" class="product-img" onerror="this.src='https://via.placeholder.com/44'"></td>
                        <td><strong>${p.name}</strong></td>
                        <td>${p.price.toLocaleString()}đ</td>
                        <td>${p.discount_price ? '<strong style="color:var(--danger);">' + p.discount_price.toLocaleString() + "đ</strong>" : "-"}</td>
                        <td>${badges}</td>
                        <td>
                            <button class="btn-action btn-delete" onclick="deleteProduct(${p.id})">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </button>
                        </td>
                    </tr>
                `;
        });
      }

      async function createProduct() {
        const data = {
          name: document.getElementById("name").value,
          price: parseFloat(document.getElementById("price").value),
          discount_price: document.getElementById("discount_price").value
            ? parseFloat(document.getElementById("discount_price").value)
            : null,
          image_url: document.getElementById("image_url").value,
          is_sale: document.getElementById("is_sale").checked,
          is_trending: document.getElementById("is_trending").checked,
        };

        const res = await fetch("/products", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            Authorization: `Bearer ${token}`,
          },
          body: JSON.stringify(data),
        });

        if (res.ok) {
          alert("Đã thêm sản phẩm thành công!");
          loadProducts();
        } else {
          alert("Không thể thêm sản phẩm!");
        }
      }

      async function deleteProduct(id) {
        if (!confirm("Bạn muốn xóa sản phẩm này?")) return;
        const res = await fetch(`/products/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });
        if (res.ok) loadProducts();
      }

      // --- HÀM QUẢN LÝ TÀI KHOẢN ---
      async function loadUsers() {
        const res = await fetch("/users", {
          headers: { Authorization: `Bearer ${token}` },
        });
        if (!res.ok) return alert("Không thể lấy danh sách người dùng!");

        const users = await res.json();
        const tbody = document.getElementById("user-list");
        tbody.innerHTML = "";

        users.forEach((u) => {
          const roleBadge = u.is_admin
            ? '<span class="badge badge-success"><i class="fa-solid fa-shield"></i> Admin</span>'
            : '<span class="badge badge-secondary">Khách hàng</span>';

          tbody.innerHTML += `
                    <tr>
                        <td>#${u.id}</td>
                        <td><strong>${u.full_name || "Chưa đặt tên"}</strong></td>
                        <td>${u.email}</td>
                        <td>${roleBadge}</td>
                        <td>
                            <button class="btn-action btn-toggle" onclick="editUser(${u.id}, '${u.full_name || ""}', '${u.email}', ${u.is_admin})">
                                <i class="fa-solid fa-pen-to-square"></i> Sửa
                            </button>
                            <button class="btn-action btn-delete" onclick="deleteUser(${u.id})">
                                <i class="fa-solid fa-trash"></i> Xóa
                            </button>
                        </td>
                    </tr>
                `;
        });
      }

      async function saveUser() {
        const id = document.getElementById("user-id-edit").value;
        const fullName = document.getElementById("user-fullname").value;
        const email = document.getElementById("user-email").value;
        const password = document.getElementById("user-password").value;
        const isAdmin = document.getElementById("user-isadmin").checked;

        if (id) {
          // Sửa User
          const res = await fetch(`/users/${id}`, {
            method: "PUT",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              full_name: fullName,
              email: email,
              is_admin: isAdmin,
            }),
          });
          if (res.ok) {
            alert("Cập nhật tài khoản thành công!");
            resetUserForm();
            loadUsers();
          } else alert("Lỗi khi cập nhật!");
        } else {
          // Thêm mới User
          if (!email || !password)
            return alert("Vui lòng nhập Email và Mật khẩu!");
          const res = await fetch("/users", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              Authorization: `Bearer ${token}`,
            },
            body: JSON.stringify({
              full_name: fullName,
              email: email,
              password: password,
            }),
          });

          if (res.ok) {
            alert("Tạo tài khoản thành công!");
            resetUserForm();
            loadUsers();
          } else {
            const err = await res.json();
            alert(err.detail || "Không thể tạo tài khoản!");
          }
        }
      }

      function editUser(id, fullName, email, isAdmin) {
        document.getElementById("user-id-edit").value = id;
        document.getElementById("user-fullname").value = fullName;
        document.getElementById("user-email").value = email;
        document.getElementById("user-isadmin").checked = isAdmin;
        document.getElementById("password-group").style.display = "none";
      }

      function resetUserForm() {
        document.getElementById("user-id-edit").value = "";
        document.getElementById("user-fullname").value = "";
        document.getElementById("user-email").value = "";
        document.getElementById("user-password").value = "";
        document.getElementById("user-isadmin").checked = false;
        document.getElementById("password-group").style.display = "block";
      }

      async function deleteUser(id) {
        if (!confirm("Bạn muốn xóa tài khoản này?")) return;
        const res = await fetch(`/users/${id}`, {
          method: "DELETE",
          headers: { Authorization: `Bearer ${token}` },
        });

        if (res.ok) loadUsers();
        else {
          const err = await res.json();
          alert(err.detail || "Không thể xóa!");
        }
      }
    </script>
  </body>
</html>
